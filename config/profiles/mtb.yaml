# Ride profiles: named presets over one weight vector.
#
# There is no separate code path per profile. Each is a set of weights over
# the same edge features, so a slider that overrides one weight behaves
# identically whichever profile it started from.
#
# `tech_target` is the technicality the rider is looking for, and `tech_sigma`
# how far either side still counts. Difficulty is a band match, not "more is
# better" — an XC rider does not want an S4 any more than a tech rider wants
# a canal towpath.
#
# `tech_max` is a safety ceiling: edges harder than this are removed from the
# graph entirely, not merely penalised.
#
# `detour` is willingness to spend time getting somewhere better. At 0 the
# planner returns the fastest route; at 2 it will spend three times as long
# on tarmac as on a perfect trail.
#
# It buys back a speed difference before it buys any trail: tarmac is about
# 1.5x faster per metre than singletrack in this model, so the first stretch of
# every lambda goes on cancelling that out rather than on finding anything. The
# values below are set from the measured cost per metre of each surface, so
# each profile accepts roughly the detour its description promises - a quarter
# longer than the road for cross-country, about twice as long for technical.

profiles:
  - id: xc
    name: Cross-country
    description: Efficient riding on firm ground. Rolls, does not fight the trail.
    tech_target: 1.0
    tech_sigma: 0.8
    tech_max: 3.0
    detour: 1.2
    weights:
      tech: 1.5
      singletrack: 0.7
      signed: 0.6
      flow: 0.2
      unpaved: 0.5
      fireroad: 0.3
      paved: -0.6
      traffic: -0.8
      descent: 0.1
      climb: -0.1
      unknown: -0.15

  - id: flow
    name: Flow
    description: Fast, rolling singletrack. Avoids anything that means pushing.
    tech_target: 1.5
    tech_sigma: 0.7
    tech_max: 3.0
    detour: 1.9
    weights:
      tech: 1.5
      singletrack: 0.8
      signed: 0.4
      flow: 1.0
      unpaved: 0.4
      fireroad: -0.2
      paved: -0.8
      traffic: -0.8
      descent: 0.9
      climb: -0.5
      unknown: -0.15

  - id: tech
    name: Technical
    description: Rough, slow, hand-cut trail. Fire roads are the price, not the point.
    tech_target: 3.0
    tech_sigma: 1.2
    tech_max: 5.0
    detour: 2.6
    weights:
      tech: 1.8
      singletrack: 1.0
      signed: 0.2
      flow: 0.3
      unpaved: 0.7
      fireroad: -0.4
      paved: -1.0
      traffic: -0.8
      descent: 0.6
      climb: -0.2
      unknown: -0.15

  - id: gravity
    name: Gravity
    description: >
      Descent-hunting. Finds the steep way down and accepts the climb between
      laps. Terrain-derived rather than bike-park data, which barely exists in
      OpenStreetMap here, so it cannot tell a real park from a steep forest
      trail.
    tech_target: 2.5
    tech_sigma: 1.0
    tech_max: 5.0
    detour: 3.4
    weights:
      tech: 1.5
      singletrack: 0.6
      signed: 0.1
      flow: 0.8
      unpaved: 0.3
      fireroad: -0.3
      paved: -0.7
      traffic: -0.8
      descent: 1.4
      climb: -1.0
      unknown: -0.15
